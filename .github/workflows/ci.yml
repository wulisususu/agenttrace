name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Refresh package registry
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build native CLI
        run: moon build --target native

      - name: Smoke test CLI
        shell: bash
        run: |
          output="$(moon run cmd/main version)"
          printf '%s\n' "$output"
          test "$output" = "AgentTrace 0.1.0-dev"

          set +e
          assertion="$(moon run cmd/main analyze-log fixtures/logs/vitest-assertion-failure.txt --format json)"
          assertion_code=$?
          set -e
          test "$assertion_code" -eq 1
          printf '%s' "$assertion" | grep -Fq '"category":"test_assertion_failure"'

          inspection="$(moon run cmd/main inspect . --format json)"
          test "$?" -eq 0
          printf '%s' "$inspection" | grep -Fq '"repository":'
          printf '%s' "$inspection" | grep -Fq '"environment":'

          normal="$(moon run cmd/main inspect . --log fixtures/logs/vitest-pass.txt --build-exit-code 0 --format json)"
          test "$?" -eq 0
          printf '%s' "$normal" | grep -Fq '"diagnoses":[]'

          set +e
          environment_case="$(moon run cmd/main inspect . --log fixtures/logs/vitest-missing-matcher.txt --build-exit-code 0 --format json)"
          environment_code=$?
          compile_case="$(moon run cmd/main inspect . --build-log fixtures/logs/tsc-type-error.txt --build-exit-code 2 --format json)"
          compile_code=$?
          set -e

          test "$environment_code" -eq 1
          printf '%s' "$environment_case" | grep -Fq '"category":"dependency_environment_error"'
          printf '%s' "$environment_case" | grep -Fq '"rule_ids":\["R001"\]'

          test "$compile_code" -eq 1
          printf '%s' "$compile_case" | grep -Fq '"category":"build_compile_error"'
          printf '%s' "$compile_case" | grep -Fq '"rule_ids":\["R002"\]'

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Refresh package registry
        run: moon update

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build native CLI
        run: moon build --target native

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $output = (moon run cmd/main version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $output -ne "AgentTrace 0.1.0-dev") {
            throw "version smoke test failed"
          }

          $assertion = (moon run cmd/main analyze-log fixtures/logs/vitest-assertion-failure.txt --format json | Out-String).Trim()
          $assertionCode = $LASTEXITCODE
          if ($assertionCode -ne 1 -or $assertion -notmatch '"category":"test_assertion_failure"') {
            throw "assertion diagnosis smoke test failed"
          }

          $inspection = (moon run cmd/main inspect . --format json | Out-String).Trim()
          $inspectCode = $LASTEXITCODE
          if ($inspectCode -ne 0 -or $inspection -notmatch '"repository":' -or $inspection -notmatch '"environment":') {
            throw "inspect smoke test failed"
          }

          $normal = (moon run cmd/main inspect . --log fixtures/logs/vitest-pass.txt --build-exit-code 0 --format json | Out-String).Trim()
          $normalCode = $LASTEXITCODE
          if ($normalCode -ne 0 -or $normal -notmatch '"diagnoses":\[\]') {
            throw "normal project smoke test failed"
          }

          $environmentCase = (moon run cmd/main inspect . --log fixtures/logs/vitest-missing-matcher.txt --build-exit-code 0 --format json | Out-String).Trim()
          $environmentCode = $LASTEXITCODE
          if ($environmentCode -ne 1 -or $environmentCase -notmatch '"category":"dependency_environment_error"' -or $environmentCase -notmatch '"rule_ids":\["R001"\]') {
            throw "R001 environment diagnosis smoke test failed"
          }

          $compileCase = (moon run cmd/main inspect . --build-log fixtures/logs/tsc-type-error.txt --build-exit-code 2 --format json | Out-String).Trim()
          $compileCode = $LASTEXITCODE
          if ($compileCode -ne 1 -or $compileCase -notmatch '"category":"build_compile_error"' -or $compileCase -notmatch '"rule_ids":\["R002"\]') {
            throw "R002 compile diagnosis smoke test failed"
          }
          exit 0
