name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Refresh package registry
        run: moon update

      - name: Install dependencies
        run: moon install

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build native CLI
        run: moon build --target native

      - name: Smoke test CLI
        shell: bash
        run: |
          output="$(moon run cmd/main)"
          printf '%s\n' "$output"
          test "$output" = "AgentTrace 0.1.0-dev"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          $env:MOONBIT_INSTALL_VERSION = $env:MOONBIT_VERSION
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show toolchain
        run: moon version --all

      - name: Refresh package registry
        run: moon update

      - name: Install dependencies
        run: moon install

      - name: Check
        run: moon check --target native --deny-warn

      - name: Test
        run: moon test --target native

      - name: Build native CLI
        run: moon build --target native

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $output = (moon run cmd/main | Out-String).Trim()
          Write-Output $output
          if ($output -ne "AgentTrace 0.1.0-dev") {
            throw "Unexpected CLI output: $output"
          }
