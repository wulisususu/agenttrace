name: visual-report

on:
  push:
    paths:
      - "web/**"
      - "src/**"
      - "cmd/**"
      - "fixtures/**"
      - "moon.mod"
      - "moon.pkg"
      - ".github/workflows/visual-report.yml"
  pull_request:
    paths:
      - "web/**"
      - "src/**"
      - "cmd/**"
      - "fixtures/**"
      - "moon.mod"
      - "moon.pkg"
      - ".github/workflows/visual-report.yml"
  workflow_dispatch:

env:
  MOONBIT_VERSION: 0.10.14+7d59c7ec9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Generate demo JSON from the real CLI
        shell: bash
        run: |
          moon update
          mkdir -p web/data

          set +e
          dependency_case="$(moon run cmd/main inspect . --log fixtures/logs/vitest-missing-matcher.txt --build-exit-code 0 --format json)"
          dependency_code=$?
          branch_case="$(moon run cmd/main inspect . --expected-branch __agenttrace_expected_branch__ --format json)"
          branch_code=$?
          compile_case="$(moon run cmd/main inspect . --build-log fixtures/logs/tsc-type-error.txt --build-exit-code 2 --format json)"
          compile_code=$?
          set -e

          test "$dependency_code" -eq 1
          test "$branch_code" -eq 1
          test "$compile_code" -eq 1

          printf '%s\n' "$dependency_case" > web/data/dependency-environment.json
          printf '%s\n' "$branch_case" > web/data/unexpected-branch.json
          printf '%s\n' "$compile_case" > web/data/source-compile-error.json

      - name: Validate Visual Report data contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          dependency = json.loads(
              Path("web/data/dependency-environment.json").read_text(encoding="utf-8")
          )
          assert dependency["schema_version"] == "0.1"
          assert dependency["build"]["status"] == "pass"
          assert dependency["tests"]["failed_suites"] == 27
          assert dependency["tests"]["failed_tests"] == 155
          d1 = dependency["diagnoses"][0]
          assert d1["category"] == "dependency_environment_error"
          assert d1["severity"] == "error"
          assert d1["confidence"] == "high"
          assert d1["rule_ids"] == ["R001"]
          assert len(d1["evidence"]) >= 2
          assert len(d1["suggested_checks"]) >= 1

          branch = json.loads(
              Path("web/data/unexpected-branch.json").read_text(encoding="utf-8")
          )
          assert branch["schema_version"] == "0.1"
          assert branch["build"] is None
          assert branch["tests"] is None
          assert branch["repository"]["branch"] != "__agenttrace_expected_branch__"
          d2 = branch["diagnoses"][0]
          assert d2["category"] == "worktree_state_error"
          assert d2["severity"] == "error"
          assert d2["confidence"] == "high"
          assert d2["rule_ids"] == ["R004"]
          assert any(e["kind"] == "branch_mismatch" for e in d2["evidence"])
          assert len(d2["suggested_checks"]) >= 1

          compile_error = json.loads(
              Path("web/data/source-compile-error.json").read_text(encoding="utf-8")
          )
          assert compile_error["schema_version"] == "0.1"
          assert compile_error["build"]["status"] == "fail"
          assert compile_error["build"]["exit_code"] == 2
          assert len(compile_error["build"]["errors"]) >= 1
          assert compile_error["build"]["errors"][0]["code"] == "TS2322"
          assert compile_error["tests"] is None
          d3 = compile_error["diagnoses"][0]
          assert d3["category"] == "build_compile_error"
          assert d3["severity"] == "error"
          assert d3["confidence"] == "high"
          assert d3["rule_ids"] == ["R002"]
          assert any(e["kind"] == "source_location" for e in d3["evidence"])
          assert len(d3["suggested_checks"]) >= 1
          PY

      - name: Smoke test static bundle over HTTP
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/agenttrace-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1

          curl --fail --silent http://127.0.0.1:4173/ | grep -Fq "AgentTrace Visual Report"
          curl --fail --silent http://127.0.0.1:4173/app.js | grep -Fq "dependency-environment.json"
          curl --fail --silent http://127.0.0.1:4173/app.js | grep -Fq "unexpected-branch.json"
          curl --fail --silent http://127.0.0.1:4173/app.js | grep -Fq "source-compile-error.json"
          curl --fail --silent http://127.0.0.1:4173/data/dependency-environment.json | grep -Fq '"rule_ids":["R001"]'
          curl --fail --silent http://127.0.0.1:4173/data/unexpected-branch.json | grep -Fq '"rule_ids":["R004"]'
          curl --fail --silent http://127.0.0.1:4173/data/source-compile-error.json | grep -Fq '"rule_ids":["R002"]'

      - name: Upload generated static report
        uses: actions/upload-artifact@v4
        with:
          name: agenttrace-visual-report
          path: web/
          if-no-files-found: error
